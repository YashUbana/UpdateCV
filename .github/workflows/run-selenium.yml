name: Run Java Selenium Online

on:
  push:
    branches: [ main ]
  workflow_dispatch:     # This adds the manual trigger button

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Selenium Test Cases
      run: mvn test
