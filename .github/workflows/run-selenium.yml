name: Run Java Selenium Online

on:
  

  push:
    branches: [ main ]
  workflow_dispatch:     # This adds the manual trigger button

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Selenium Test Cases
      env:
        # This links your GitHub Secret to your Java Environment Context
        NAUKRI_JSON_COOKIES: ${{ secrets.NAUKRI_JSON_COOKIES }}
      run: mvn test

    - name: Upload Error Screenshots
      uses: actions/upload-artifact@v4
      if: always()  # Uploads screenshots whether tests pass or fail
      with:
        name: selenium-screenshots
        path: screenshots/*.png  # <--- This will grab EVERY image inside the folder!
        if-no-files-found: ignore
